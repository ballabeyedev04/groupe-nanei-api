# ============================================================
#  Groupe Nanei API — Configuration Nginx (VPS Ubuntu)
#  Remplacer : YOUR_DOMAIN par votre vrai domaine
#              ex: api.groupe-nanei.fr
#  Déposer dans : /etc/nginx/sites-available/groupe-nanei-api
#  Activer via  : ln -sf /etc/nginx/sites-available/groupe-nanei-api \
#                        /etc/nginx/sites-enabled/groupe-nanei-api
#
#  L'API n'utilise pas de WebSocket : pas besoin de la map
#  $connection_upgrade (évite aussi un doublon si une autre API du VPS
#  la définit déjà dans conf.d).
# ============================================================

# Upstream Node.js (port hôte publié par docker-compose.prod.yml)
upstream groupe_nanei_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot ACME challenge (renouvellement automatique)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur HTTPS principal ───────────────────────────────────────────────────
server {
    # "listen … http2" plutôt que la directive "http2 on;" : cette dernière
    # n'existe qu'à partir de Nginx 1.25.1 (Ubuntu 22.04 fournit la 1.18).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── Certificats Let's Encrypt (générés par Certbot) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    # Protocoles, chiffrements et sessions TLS : définis par
    # options-ssl-nginx.conf (Certbot) — les redéclarer ici fait échouer
    # "nginx -t" (directive dupliquée).

    # ── Headers sécurité ─────────────────────────────────────────────────────
    # Les autres en-têtes (X-Frame-Options, nosniff, Referrer-Policy…) sont
    # posés par helmet côté Express : les redéclarer ici les dupliquerait.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Taille max des requêtes ──────────────────────────────────────────────
    # Pièces jointes de la réponse à un devis : 20 Mo au total côté API
    # (voir piecesJointes.middleware.js) + marge pour l'encodage multipart.
    client_max_body_size  25M;
    client_body_timeout   60s;
    client_header_timeout 10s;
    send_timeout          30s;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_min_length   1024;
    gzip_types
        text/plain
        application/json;

    # ── Health check direct (pas de log) ─────────────────────────────────────
    location = /health {
        access_log off;
        proxy_pass         http://groupe_nanei_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
    }

    # ── Proxy vers l'API Node.js ──────────────────────────────────────────────
    location / {
        proxy_pass         http://groupe_nanei_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Headers transmis à Express (nécessaires pour trust proxy + IP réelle,
        # utilisée par le rate limiting)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/groupe-nanei-api-access.log combined;
    error_log  /var/log/nginx/groupe-nanei-api-error.log warn;
}
