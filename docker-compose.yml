# Stack de développement local : base Postgres + API avec rechargement à
# chaud via le montage du code source.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-groupe_nanei}
      POSTGRES_USER: ${DB_USER:-groupe_nanei}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-groupe_nanei}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      DB_HOST: postgres
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
